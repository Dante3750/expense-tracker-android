version: 2
updates:
  # Library and plugin versions in gradle/libs.versions.toml
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin-and-build:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*", "com.android.*"]

  # Action versions in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
