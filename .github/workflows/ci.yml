name: CI

# Every push and pull request: validate the wrapper, run unit tests and lint, build a debug APK.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write # upload lint SARIF to code scanning

jobs:
  build:
    name: Test, lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle, and validates gradle-wrapper.jar against known checksums.
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: expense-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

      - name: Publish lint results to code scanning
        if: always()
        continue-on-error: true # needs GitHub code scanning (free on public repos)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: android-lint
